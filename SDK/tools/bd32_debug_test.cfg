# =============================================================================
# BD32 Debug 全功能一键测试（OpenOCD TCL 批处理，无 GDB / 无 socket）
# 用法：openocd -f ./SDK/tools/bd32_debug_test.cfg
# 本脚本禁用 telnet/gdb/tcl 端口（无 socket，任意环境可运行）。
# =============================================================================
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

proc dmiw {a v} { bd32.cpu riscv dmi_write $a $v }
proc dmir {a} { return [bd32.cpu riscv dmi_read $a] }

proc getreg {name} {
    set r [reg $name]
    if {[regexp {0x[0-9a-fA-F]+} $r val]} { return $val }
    return $r
}

proc gpr_read_dmi {n} {
    dmiw 0x17 [format 0x%08x [expr {0x00221000 | $n}]]
    return [dmir 0x04]
}

proc gpr_write_dmi {n v} {
    dmiw 0x04 $v
    dmiw 0x17 [format 0x%08x [expr {0x00231000 | $n}]]
}

proc read_dpc {} {
    dmiw 0x17 0x002207B1
    return [dmir 0x04]
}

proc sba_write {addr val} {
    dmiw 0x38 0x40000
    dmiw 0x39 $addr
    dmiw 0x3c $val
}

proc sba_read {addr} {
    dmiw 0x38 0x140000
    dmiw 0x39 $addr
    return [dmir 0x3c]
}

proc report {tag ok} {
    if {$ok} {
        puts "    \[PASS\] $tag"
    } else {
        puts "    \[FAIL\] $tag"
    }
}

proc bd32_test {} {
    puts "=============================================================="
    puts "BD32 Debug 全功能一键测试"
    puts "=============================================================="

    init

    # 清理上次运行残留（trigger/haltreq/ndmreset），保证干净起点：
    # dmactive=0 复位 DM 内部状态，再重新激活；随后用 OpenOCD halt 建立一致状态。
    dmiw 0x11 0x00000000
    dmiw 0x11 0x00000001
    catch {halt}

    puts {--- [1] JTAG IDCODE / scan_chain ---}
    scan_chain

    puts {--- [2] halt / PC ---}
    halt
    puts "    PC = [getreg pc]"

    puts {--- [3] GPR 写/读（OpenOCD reg + DMI 直读交叉验证）---}
    set a0_old [gpr_read_dmi 10]
    reg a0 0x12345678
    set v1 [gpr_read_dmi 10]
    puts "    reg a0 写 0x12345678 后 DMI 直读 x10 = $v1"
    report "GPR 写/读回" [expr {$v1 == 0x12345678}]
    reg a0 $a0_old

    puts {--- [4] CSR 读（misa/mstatus/mtvec 走 abstract）---}
    # 通用 CSR 抽象读：regno = 0xC000|csr, transfer=1(bit17)
    proc csr_read {csr} {
        dmiw 0x17 [format 0x%08x [expr {0x0022C000 | $csr}]]
        return [dmir 0x04]
    }
    set misa_v    [csr_read 0x301]
    set mstatus_v [csr_read 0x300]
    set mtvec_v   [csr_read 0x305]
    puts "    misa = $misa_v, mstatus = $mstatus_v, mtvec = $mtvec_v"
    report "CSR 读（misa/mstatus/mtvec）" [expr {$misa_v == 0x40001100 && $mstatus_v == 0x00001800}]

    puts {--- [5] dcsr/dpc 抽象读（DMI 直读）---}
    dmiw 0x17 0x002207B0
    set dcsr_v [dmir 0x04]
    set dpc_v [read_dpc]
    puts "    dcsr = $dcsr_v, dpc = $dpc_v"
    report "dcsr/dpc 读" [expr {$dcsr_v != 0}]

    puts {--- [6] 单步 x3（预期 PC 每步 +4）---}
    # 先 reset halt 清掉残留状态（mtvec/PC），再用 NOP 滑道保证每步 +4：
    # 步进到会 trap 的指令（非法/总线错误）时，修复后的行为是跳到 mtvec，不再是 +4，因此测试必须从已知 NOP 序列起步。
    catch {reset halt}
    sba_write 0x10200 0x00000013
    sba_write 0x10204 0x00000013
    sba_write 0x10208 0x00000013
    reg pc 0x10200
    set p0 [getreg pc]
    step
    set p1 [getreg pc]
    step
    set p2 [getreg pc]
    step
    set p3 [getreg pc]
    puts "    PC: $p0 -> $p1 -> $p2 -> $p3"
    report "单步 +4" [expr {($p1 == $p0 + 4) && ($p2 == $p1 + 4) && ($p3 == $p2 + 4)}]

    puts {--- [7] resume 后 halt ---}
    resume
    sleep 200
    halt
    set p_r [getreg pc]
    puts "    resume 后 PC = $p_r"
    report "resume/halt" [expr {$p_r != $p3}]

    puts {--- [8] SBA 内存读写（ITCM 0x10000 / DTCM 0x00020000）---}
    sba_write 0x10000 0x12345678
    set itcm_r [sba_read 0x10000]
    sba_write 0x00020000 0xdeadbeef
    set dtcm_r [sba_read 0x00020000]
    puts "    ITCM 读回 $itcm_r, DTCM 读回 $dtcm_r"
    report "SBA ITCM 读写" [expr {$itcm_r == 0x12345678}]
    report "SBA DTCM 读写" [expr {$dtcm_r == 0xdeadbeef}]

    puts {--- [9] Trigger 硬件断点 ---}
    # 注意：trigger halt 时 dpc = 命中地址，resume 会从 dpc 重新取指，
    # 断点若设在当前 PC，resume 瞬间会再次命中而卡死（OpenOCD 报 unable to resume）。
    # 正确验证：SBA 在 ITCM 0x10200 写 NOP 滑道，断点设 0x10204，
    # resume 到 0x10200，CPU 先执行 NOP 再命中 0x10204。
    sba_write 0x10200 0x00000013
    sba_write 0x10204 0x00000013
    sba_write 0x10208 0x00000013
    sba_write 0x1020c 0x00000013
    dmiw 0x04 0x28000004
    dmiw 0x17 0x002307A1
    dmiw 0x04 0x10204
    dmiw 0x17 0x002307A2
    dmiw 0x17 0x002207A1
    set tdata1_r [dmir 0x04]
    puts "    tdata1 读回 $tdata1_r ，断点地址 0x10204，resume 起点 0x10200"
    set resume_err [catch {resume 0x10200} res_msg]
    if {$resume_err} { puts "    resume 返回错误：$res_msg（继续读状态验证命中）" }
    sleep 300
    set ds [dmir 0x11]
    puts "    resume 后 dmstatus = $ds （bit8 anyhalted=1 才算命中）"
    report "Trigger 硬件断点命中" [expr {($ds & 0x100) != 0}]
    set dpc_v [read_dpc]
    puts "    trigger halt 后 dpc = $dpc_v （预期 0x10204）"
    report "Trigger 停在断点地址" [expr {$dpc_v == 0x10204}]
    dmiw 0x17 0x002207B0
    set dcsr_v [dmir 0x04]
    puts "    dcsr 读回 $dcsr_v"
    # Debug Spec 1.0：cause 在 [8:6]，trigger=2（dcsr 读回含 debugver=4）
    report "dcsr.cause=trigger" [expr {($dcsr_v & 0x1C0) == 0x80}]
    dmiw 0x04 0x28000000
    dmiw 0x17 0x002307A1

    puts {--- [10] reset halt（ndmreset 复位 SoC + haltreq 驻留 → 停在复位向量 0x0）---}
    catch {halt}
    catch {reset halt}
    set p_rh [getreg pc]
    puts "    reset halt 后 PC = $p_rh"
    report "reset halt 回 0x0" [expr {$p_rh == 0x0}]

    catch {halt}
    puts "=============================================================="
    puts "BD32 Debug 全功能一键测试结束"
    puts "=============================================================="
    shutdown
}

bd32_test

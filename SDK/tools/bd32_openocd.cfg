# =============================================================================
# BD32 SoC — OpenOCD 配置
# 调试器：Sipeed RV-Debugger (FT2232H)
# 目标：BD32 RV32IM + Debug Module (Spec 0.13)
# =============================================================================

# --- 适配器：FTDI FT2232H ---
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# JTAG 引脚映射（ADBUS）
# bit0=TCK(out) bit1=TDI(out) bit2=TDO(in) bit3=TMS(out)
# 不接 nSRST，仅四线 JTAG
ftdi layout_init 0x0008 0x000b

# JTAG 时钟（kHz）— 杜邦线连接用低速
adapter speed 500

transport select jtag

# --- TAP 定义 ---
# IDCODE = 0x1BD32003
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003

# --- Target 定义 ---
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap

# RISC-V Debug Module 参数
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11

# 无硬件复位线，仅软复位
reset_config none

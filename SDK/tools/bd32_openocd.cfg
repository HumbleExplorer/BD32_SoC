# =============================================================================
# BD32 SoC — OpenOCD 配置
# 调试器：Sipeed RV-Debugger (FT2232H)
# 目标：BD32 RV32IM + Debug Module (Spec 0.13)
# =============================================================================

# --- 适配器：FTDI FT2232H ---
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# JTAG 引脚映射（ADBUS）
# bit0=TCK(out) bit1=TDI(out) bit2=TDO(in) bit3=TMS(out)
# bit5=dbg_rst（高有效 FPGA 复位，可选，供 fpga_reset 命令使用）
ftdi layout_init 0x0008 0x000b
ftdi layout_signal dbg_rst -data 0x0020 -oe 0x0020

# JTAG 时钟（kHz）— 杜邦线连接用低速
adapter speed 500

transport select jtag

# --- TAP 定义 ---
# IDCODE = 0x1BD32003
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003

# --- Target 定义 ---
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap

# RISC-V Debug Module 参数
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11

# FPGA 复位命令（驱动 ADBUS5=0x20，高有效；WinUSB 模式即可，无需 ftd2xx/切换驱动，参考 E203 SDK openocd_evalsoc.cfg）
# 用法：openocd -f bd32_openocd.cfg -c "init; fpga_reset; shutdown"
proc fpga_reset {{hold 500}} {
    ftdi set_signal dbg_rst 1
    sleep $hold
    ftdi set_signal dbg_rst 0
}
proc fpga_reset_assert {} { ftdi set_signal dbg_rst 1 }
proc fpga_reset_release {} { ftdi set_signal dbg_rst 0 }

# 无硬件复位线，仅软复位
reset_config none

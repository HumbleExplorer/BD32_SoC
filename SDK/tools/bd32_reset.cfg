# =============================================================================
# BD32 FPGA 复位配置（OpenOCD 驱动 FTDI ADBUS5，WinUSB 模式）
# 无需 ftd2xx / 无需切换驱动；方案参考 E203 SDK openocd_evalsoc.cfg
# 用法：openocd -f bd32_reset.cfg -c "init; fpga_reset; shutdown"
#       （--assert / --release 分别用 fpga_reset_assert / fpga_reset_release）
# =============================================================================
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# ADBUS 引脚：bit0=TCK bit1=TDI bit2=TDO(in) bit3=TMS bit5=dbg_rst(高有效复位)
ftdi layout_init 0x0008 0x000b
ftdi layout_signal dbg_rst -data 0x0020 -oe 0x0020

adapter speed 500

transport select jtag

# 复位不需要目标/JTAG 链，禁用 socket 端口（任意环境可运行）
telnet port disabled
gdb port disabled
tcl port disabled

proc fpga_reset {{hold 500}} {
    ftdi set_signal dbg_rst 1
    sleep $hold
    ftdi set_signal dbg_rst 0
}
proc fpga_reset_assert {} { ftdi set_signal dbg_rst 1 }
proc fpga_reset_release {} { ftdi set_signal dbg_rst 0 }

# =============================================================================
# BD32 watchpoint（数据观察点）上板测试（OpenOCD TCL 批处理）
# 验证 4 路 mcontrol trigger 的 load/store 地址匹配：
#   1) 写观察点：sw 命中即 halt，dpc=sw 指令，store 未提交，清除后 resume 落盘
#   2) 读观察点：lw 命中即 halt，dpc=lw 指令，x3 未写回，清除后 resume 读到值
#   3) 宽度过滤：sizelo=32bit 时 sb(8bit) 不命中、sw(32bit) 命中
#   4) 无访问不误命中
# 用法：openocd -f ./SDK/tools/bd32_watchpoint_test.cfg
# =============================================================================
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

proc dmiw {a v} { bd32.cpu riscv dmi_write $a $v }
proc dmir {a} { return [bd32.cpu riscv dmi_read $a] }

proc sba_write {addr val} {
    dmiw 0x38 0x40000
    dmiw 0x39 $addr
    dmiw 0x3c $val
}
proc sba_read {addr} {
    dmiw 0x38 0x140000
    dmiw 0x39 $addr
    return [dmir 0x3c]
}
proc gpr_write_dmi {n v} {
    dmiw 0x04 $v
    dmiw 0x17 [format 0x%08x [expr {0x00231000 | $n}]]
}
proc gpr_read_dmi {n} {
    dmiw 0x17 [format 0x%08x [expr {0x00221000 | $n}]]
    return [dmir 0x04]
}
proc read_dpc {} {
    dmiw 0x17 0x002207B1
    return [dmir 0x04]
}
proc read_dcsr {} {
    dmiw 0x17 0x002207B0
    return [dmir 0x04]
}
proc set_dpc {v} {
    dmiw 0x04 $v
    dmiw 0x17 0x002307B1
}
proc trig_set {tdata1 tdata2} {
    # tselect = 0
    dmiw 0x04 0x00000000
    dmiw 0x17 0x002307A0
    dmiw 0x04 $tdata1
    dmiw 0x17 0x002307A1
    dmiw 0x04 $tdata2
    dmiw 0x17 0x002307A2
}
proc trig_clear {} {
    dmiw 0x04 0x00000000
    dmiw 0x17 0x002307A0
    dmiw 0x04 0x28000000
    dmiw 0x17 0x002307A1
}
proc report {tag ok} {
    if {$ok} { puts "    \[PASS\] $tag" } else { puts "    \[FAIL\] $tag" }
}

proc bd32_watchpoint_test {} {
    puts "=============================================================="
    puts "BD32 watchpoint on-board test"
    puts "=============================================================="
    init

    # clean start: DM reset then halt
    dmiw 0x11 0x00000000
    dmiw 0x11 0x00000001
    catch {halt}

    # 0x10200 起铺 NOP 滑道，避免误触发/跑飞
    for {set i 0} {$i < 16} {incr i} {
        sba_write [expr {0x10200 + $i * 4}] 0x00000013
    }
    sba_write 0x00020000 0xCAFEBABE

    puts {--- [1] 写观察点：sw x1,0(x2) @0x10200，监视 DTCM 0x20000 ---}
    sba_write 0x10200 0x00112023
    gpr_write_dmi 1 0xDEADBEEF
    gpr_write_dmi 2 0x00020000
    sba_write 0x00020000 0xCAFEBABE
    trig_set 0x28000002 0x00020000
    set_dpc 0x10200
    catch {resume 0x10200} msg
    sleep 300
    set ds [dmir 0x11]
    puts "    dmstatus = $ds (bit8/9 halted)"
    report "store-wp: halted" [expr {($ds & 0x300) != 0}]
    set dpc [read_dpc]
    puts "    dpc = $dpc (expect 0x10200)"
    report "store-wp: dpc=sw" [expr {$dpc == 0x10200}]
    set dcsr [read_dcsr]
    puts "    dcsr = $dcsr (cause field expect 2)"
    report "store-wp: dcsr.cause=trigger" [expr {($dcsr & 0x1C0) == 0x80}]
    set mem [sba_read 0x00020000]
    puts "    DTCM 0x20000 = $mem (expect 0xCAFEBABE)"
    report "store-wp: store 未提交" [expr {$mem == 0xCAFEBABE}]
    trig_clear
    catch {resume 0x10200} msg
    sleep 200
    catch {halt}
    set mem [sba_read 0x00020000]
    puts "    after clear+resume: DTCM 0x20000 = $mem (expect 0xDEADBEEF)"
    report "store-wp: resume 后落盘" [expr {$mem == 0xDEADBEEF}]

    puts {--- [2] 读观察点：lw x3,0(x2) @0x10200，监视 DTCM 0x20000 ---}
    sba_write 0x10200 0x00012183
    gpr_write_dmi 2 0x00020000
    gpr_write_dmi 3 0x00000000
    sba_write 0x00020000 0xDEADBEEF
    trig_set 0x28000001 0x00020000
    set_dpc 0x10200
    catch {resume 0x10200} msg
    sleep 300
    set ds [dmir 0x11]
    puts "    dmstatus = $ds (bit8/9 halted)"
    report "load-wp: halted" [expr {($ds & 0x300) != 0}]
    set dpc [read_dpc]
    puts "    dpc = $dpc (expect 0x10200)"
    report "load-wp: dpc=lw" [expr {$dpc == 0x10200}]
    set dcsr [read_dcsr]
    puts "    dcsr = $dcsr (cause field expect 2)"
    report "load-wp: dcsr.cause=trigger" [expr {($dcsr & 0x1C0) == 0x80}]
    set x3 [gpr_read_dmi 3]
    puts "    x3 = $x3 (expect 0)"
    report "load-wp: x3 未写回" [expr {$x3 == 0x00000000}]
    trig_clear
    catch {resume 0x10200} msg
    sleep 200
    catch {halt}
    set x3 [gpr_read_dmi 3]
    puts "    after clear+resume: x3 = $x3 (expect 0xDEADBEEF)"
    report "load-wp: resume 后 x3=0xDEADBEEF" [expr {$x3 == 0xDEADBEEF}]

    puts {--- [3] 宽度过滤：sb(8bit) 不命中 32bit 观察点，sw 命中 ---}
    sba_write 0x10200 0x00110023
    sba_write 0x10204 0x00112023
    gpr_write_dmi 1 0xAABBCCDD
    gpr_write_dmi 2 0x00020000
    sba_write 0x00020000 0xFFFFFFFF
    trig_set 0x28030002 0x00020000
    set_dpc 0x10200
    catch {resume 0x10200} msg
    sleep 300
    set ds [dmir 0x11]
    puts "    dmstatus = $ds (bit8/9 halted)"
    report "width: halted at sw" [expr {($ds & 0x300) != 0}]
    set dpc [read_dpc]
    puts "    dpc = $dpc (expect 0x10204)"
    report "width: dpc=sw@0x10204" [expr {$dpc == 0x10204}]
    set mem [sba_read 0x00020000]
    puts "    DTCM 0x20000 = $mem (expect 0xFFFFFFDD, sb 已提交/sw 未提交)"
    report "width: sb 已提交 sw 未提交" [expr {$mem == 0xFFFFFFDD}]
    trig_clear
    catch {resume 0x10204} msg
    sleep 200
    catch {halt}
    set mem [sba_read 0x00020000]
    puts "    after clear+resume: DTCM 0x20000 = $mem (expect 0xAABBCCDD)"
    report "width: resume 后 sw 落盘" [expr {$mem == 0xAABBCCDD}]

    puts {--- [4] 无访问不误命中：监视 0x20100，代码只访问 0x20000 ---}
    sba_write 0x10200 0x00112023
    gpr_write_dmi 1 0x12345678
    gpr_write_dmi 2 0x00020000
    trig_set 0x28000002 0x00020100
    set_dpc 0x10200
    catch {resume 0x10200} msg
    sleep 200
    set ds [dmir 0x11]
    puts "    dmstatus = $ds (bit11 allrunning)"
    report "no-false-hit: 仍在运行" [expr {($ds & 0x800) != 0}]
    catch {halt}
    trig_clear

    puts "=============================================================="
    puts "BD32 watchpoint on-board test done"
    puts "=============================================================="
    shutdown
}

bd32_watchpoint_test

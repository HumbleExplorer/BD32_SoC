# BD32 板上诊断 v3：catch(init) + 裸 DMI SBA 读（不依赖 halt/examine）
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

proc dmiw {a v} { bd32.cpu riscv dmi_write $a $v }
proc dmir {a} { return [bd32.cpu riscv dmi_read $a] }
proc sba_read {addr} {
    dmiw 0x38 0x140000
    dmiw 0x39 $addr
    return [dmir 0x3c]
}

catch { init }
puts "DTMCS: [format 0x%08x [dmir 0x10]]"
puts "MROM0: [format 0x%08x [sba_read 0x00000000]] [format 0x%08x [sba_read 0x00000004]] [format 0x%08x [sba_read 0x00000008]]"
puts "ITCM0: [format 0x%08x [sba_read 0x00010000]] [format 0x%08x [sba_read 0x00010004]]"
puts "FREQ_STORED: [format 0x%08x [sba_read 0x0002fff0]]"
puts "UART_LSR: [format 0x%08x [sba_read 0xe0010014]]"
# dtmcs 里读 dpc 不行；用 abstract 命令读 dpc(0x7b1)：data0=0x04
dmiw 0x04 0
dmiw 0x17 0x0022107B1
puts "DPC_VIA_ABSTRACT: [format 0x%08x [dmir 0x04]]"
shutdown

# BD32 SBA 外设总线访问 上板测试（需新 bitstream：SBA 译码修复 + 外设总线）
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

proc dmiw {a v} { bd32.cpu riscv dmi_write $a $v }
proc dmir {a} { return [bd32.cpu riscv dmi_read $a] }
proc sba_write {addr val} {
    dmiw 0x38 0x40000
    dmiw 0x39 $addr
    dmiw 0x3c $val
}
proc sba_read {addr} {
    dmiw 0x38 0x140000
    dmiw 0x39 $addr
    return [dmir 0x3c]
}
proc report {tag ok} {
    if {$ok} { puts "    \[PASS\] $tag" } else { puts "    \[FAIL\] $tag" }
}

proc sba_periph_test {} {
    puts "=== BD32 SBA peripheral bus test ==="
    init
    dmiw 0x11 0x00000000
    dmiw 0x11 0x00000001
    catch {halt}

    puts {--- [1] SBA DTCM 真实地址 0x00020000（新译码）---}
    sba_write 0x00020000 0xDEADBEEF
    set v [sba_read 0x00020000]
    puts "    readback = $v (expect 0xDEADBEEF)"
    report "SBA DTCM 0x00020000 write/read" [expr {$v == 0xDEADBEEF}]

    puts {--- [2] GPIO OUTPUT 0xE0000008 全字写读回 ---}
    sba_write 0xE0000008 0xA5A5A5A5
    set v [sba_read 0xE0000008]
    puts "    readback = $v (expect 0xA5A5A5A5)"
    report "SBA GPIO word write/read" [expr {$v == 0xA5A5A5A5}]

    puts {--- [3] GPIO 字节写 0xE0000009=0x11 -> 0xA5A511A5 ---}
    dmiw 0x38 0x00000
    dmiw 0x39 0xE0000009
    dmiw 0x3c 0x00000011
    set v [sba_read 0xE0000008]
    puts "    readback = $v (expect 0xA5A511A5)"
    report "SBA GPIO byte write" [expr {$v == 0xA5A511A5}]

    puts {--- [4] 读 UART 状态/CLINT mtime（外设读）---}
    set lsr [sba_read 0xE0010014]
    set mtime [sba_read 0xF200BFF8]
    puts "    UART LSR = $lsr, CLINT mtime = $mtime"
    report "SBA read peripherals" [expr {$mtime > 0}]

    puts {--- [5] 未映射地址 sberror ---}
    dmiw 0x38 0x00140000
    dmiw 0x39 0x12345678
    set sbcs [dmir 0x38]
    puts "    sbcs = $sbcs (sberror bits expect 010)"
    report "SBA unmapped sberror" [expr {($sbcs & 0x7000) == 0x2000}]

    puts {--- [6] halt 状态保持 ---}
    set ds [dmir 0x11]
    report "halt kept after bus access" [expr {($ds & 0x300) != 0}]

    catch {halt}
    puts "=== done ==="
    shutdown
}
sba_periph_test

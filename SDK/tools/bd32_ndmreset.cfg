# ndmreset via raw JTAG (irscan/drscan, 不依赖 examine/halt)
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

init
# BD32 DTM: abits=7 → DMI 总位宽 41 (addr[40:34], op[33:32], data[31:0])
set total 41
puts "TOTAL_BITS: $total"

# DMI 请求: {addr[abits-1:0], op[1:0], data[31:0]}
proc dmi_raw {op addr data} {
    global total
    irscan bd32.tap 0x11
    set w [expr {($addr << 34) | ($op << 32) | ($data & 0xFFFFFFFF)}]
    return [drscan bd32.tap $total $w]
}
proc dmiw_raw {addr val} {
    dmi_raw 1 $addr $val
    # nop 读回状态（op=0）
    set r [dmi_raw 0 0 0]
    return [expr {($r >> 32) & 0x3}]
}
proc dmir_raw {addr} {
    dmi_raw 1 $addr 0
    set r [dmi_raw 0 0 0]
    return [expr {$r & 0xFFFFFFFF}]
}

# ndmreset 脉冲
set st [dmiw_raw 0x10 0x00000003]
puts "NDMRESET_SET_STATUS: $st"
sleep 150
dmiw_raw 0x10 0x00000001
sleep 300
puts "RESET_RELEASED"
shutdown

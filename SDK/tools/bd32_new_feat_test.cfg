# BD32 new-feature on-board test: SBA byte/halfword write, dual trigger, ebreak->debug
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

proc dmiw {a v} { bd32.cpu riscv dmi_write $a $v }
proc dmir {a} { return [bd32.cpu riscv dmi_read $a] }

proc sba_write {addr val} {
    dmiw 0x38 0x40000
    dmiw 0x39 $addr
    dmiw 0x3c $val
}
proc sba_write8 {addr val} {
    dmiw 0x38 0x00000
    dmiw 0x39 $addr
    dmiw 0x3c $val
}
proc sba_write16 {addr val} {
    dmiw 0x38 0x20000
    dmiw 0x39 $addr
    dmiw 0x3c $val
}
proc sba_read {addr} {
    dmiw 0x38 0x140000
    dmiw 0x39 $addr
    return [dmir 0x3c]
}
proc read_dpc {} {
    dmiw 0x17 0x002207B1
    return [dmir 0x04]
}
proc read_dcsr {} {
    dmiw 0x17 0x002207B0
    return [dmir 0x04]
}
proc set_dpc {v} {
    dmiw 0x04 $v
    dmiw 0x17 0x002307B1
}
proc report {tag ok} {
    if {$ok} { puts "    \[PASS\] $tag" } else { puts "    \[FAIL\] $tag" }
}

proc bd32_new_feat_test {} {
    puts "=============================================================="
    puts "BD32 new-feature on-board test"
    puts "=============================================================="
    init

    # clean start: DM reset then halt
    dmiw 0x11 0x00000000
    dmiw 0x11 0x00000001
    catch {halt}

    puts {--- [1] SBA byte write (ITCM 0x10201=0xAA on 0x00000013) ---}
    sba_write 0x10200 0x00000013
    sba_write8 0x10201 0x000000AA
    set v [sba_read 0x10200]
    puts "    readback 0x10200 = $v (expect 0x0000AA13)"
    report "SBA byte write" [expr {$v == 0x0000AA13}]

    puts {--- [2] SBA halfword write (ITCM 0x10202=0x1234) ---}
    sba_write16 0x10202 0x00001234
    set v [sba_read 0x10200]
    puts "    readback 0x10200 = $v (expect 0x1234AA13)"
    report "SBA halfword write" [expr {$v == 0x1234AA13}]

    puts {--- [3] SBA byte write DTCM (0x20000003=0x11 on 0xCAFEBABE) ---}
    sba_write 0x00020000 0xCAFEBABE
    sba_write8 0x00020003 0x00000011
    set v [sba_read 0x00020000]
    puts "    readback 0x00020000 = $v (expect 0x11FEBABE)"
    report "SBA DTCM byte write" [expr {$v == 0x11FEBABE}]

    # restore NOP sled for trigger test
    sba_write 0x10200 0x00000013
    sba_write 0x10204 0x00000013
    sba_write 0x10208 0x00000013
    sba_write 0x1020c 0x00000013

    puts {--- [4] dual hardware breakpoints (tselect0=0x10204, tselect1=0x10208) ---}
    # trigger 0
    dmiw 0x04 0x00000000
    dmiw 0x17 0x002307A0
    dmiw 0x04 0x28000004
    dmiw 0x17 0x002307A1
    dmiw 0x04 0x10204
    dmiw 0x17 0x002307A2
    # trigger 1
    dmiw 0x04 0x00000001
    dmiw 0x17 0x002307A0
    dmiw 0x04 0x28000004
    dmiw 0x17 0x002307A1
    dmiw 0x04 0x10208
    dmiw 0x17 0x002307A2
    # tselect readback
    dmiw 0x17 0x002207A0
    set ts [dmir 0x04]
    puts "    tselect readback = $ts (expect 1)"
    report "tselect=1 readback" [expr {$ts == 1}]
    # resume from 0x10200 -> hit trigger0 at 0x10204
    catch {resume 0x10200} msg
    sleep 300
    set dpc [read_dpc]
    puts "    after resume: dpc = $dpc (expect 0x10204)"
    report "dual trigger: hit 0x10204" [expr {$dpc == 0x10204}]
    # clear trigger0, resume from 0x10204 -> hit trigger1 at 0x10208
    dmiw 0x04 0x00000000
    dmiw 0x17 0x002307A0
    dmiw 0x04 0x28000000
    dmiw 0x17 0x002307A1
    catch {resume 0x10204} msg
    sleep 300
    set dpc [read_dpc]
    puts "    after resume: dpc = $dpc (expect 0x10208)"
    report "dual trigger: hit 0x10208" [expr {$dpc == 0x10208}]
    # clear trigger1
    dmiw 0x04 0x00000001
    dmiw 0x17 0x002307A0
    dmiw 0x04 0x28000000
    dmiw 0x17 0x002307A1
    catch {halt}

    puts {--- [5] ebreak enters debug mode ---}
    # write ebreak at 0x10200, dcsr.ebreakm=1, dpc=0x10200, resume
    sba_write 0x10200 0x00100073
    dmiw 0x04 0x00008000
    dmiw 0x17 0x002307B0
    set_dpc 0x10200
    catch {resume 0x10200} msg
    sleep 300
    set ds [dmir 0x11]
    puts "    dmstatus = $ds (bit8/9 any/allhalted)"
    report "ebreak: halted" [expr {($ds & 0x300) != 0}]
    set dpc [read_dpc]
    puts "    dpc = $dpc (expect 0x10200)"
    report "ebreak: dpc=0x10200" [expr {$dpc == 0x10200}]
    set dcsr [read_dcsr]
    puts "    dcsr = $dcsr (cause field expect 1)"
    report "ebreak: dcsr.cause=1" [expr {($dcsr & 0x1C0) == 0x40}]
    # clear ebreakm, restore NOP, resume should run
    dmiw 0x04 0x00000000
    dmiw 0x17 0x002307B0
    sba_write 0x10200 0x00000013
    catch {resume 0x10200} msg
    sleep 300
    set ds [dmir 0x11]
    puts "    after resume: dmstatus = $ds (bit11 allrunning)"
    report "ebreak: resume runs" [expr {($ds & 0x800) != 0}]

    catch {halt}
    puts "=============================================================="
    puts "BD32 new-feature on-board test done"
    puts "=============================================================="
    shutdown
}

bd32_new_feat_test

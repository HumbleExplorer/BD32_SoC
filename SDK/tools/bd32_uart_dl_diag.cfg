# =============================================================================
# BD32 UART 下载状态诊断（上板只读取证）
#
# 用途：uart_send 下载"0 字节/卡住"时的分层取证——
#   [1] 引导状态：MODE_SEL 跳线、GPIO_OUT 模式指示（0x08=normal / 0x10=download）
#   [2] 下载进度：DBG_STAT（bit0=done、bit1=en）、UART LSR（FE/THRE/TEMT）
#   [3] ITCM 落盘：头 8 字（预期首字=固件第一条指令）
#   [4] 时钟活性：CLINT mtime 双读递增
# 用法：openocd -f bd32_uart_dl_diag.cfg   （先关 vivado hw_server 释放 FTDI）
# 判读：GPIO_OUT=0x10 且 DBG_STAT bit0=0 = 在下载模式但下载未完成；
#       LSR FE=1 = 接收坏帧（相位/波特率问题）；ITCM 头字与固件比对即知错位。
# =============================================================================
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
set _TARGETNAME bd32.cpu
target create $_TARGETNAME riscv -chain-position bd32.tap
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

proc dmiw {a v} { bd32.cpu riscv dmi_write $a $v }
proc dmir {a} { return [bd32.cpu riscv dmi_read $a] }
proc sba_read {addr} {
    dmiw 0x38 0x140000
    dmiw 0x39 $addr
    return [dmir 0x3c]
}

init
puts "=== BD32 UART download state diagnostic ==="

puts {--- [1] boot mode ---}
set gin [sba_read 0xE000000C]
set gout [sba_read 0xE0000008]
puts "GPIO_IN  = $gin  (bit0 MODE_SEL)"
puts "GPIO_OUT = $gout (0x08=normal LED0 / 0x10=download LED1)"

puts {--- [2] download progress ---}
set dbs [sba_read 0xE0010020]
puts "DBG_STAT = $dbs  (bit0=done, bit1=en)"
set lsr [sba_read 0xE0010014]
puts "UART LSR = $lsr  (bit3=FE, bit7=error-summary)"

puts {--- [3] ITCM head (expect first word = firmware 1st inst) ---}
set i 0
while {$i < 8} {
    set addr [expr {0x10000 + $i*4}]
    set w [sba_read $addr]
    puts "ITCM $i = $w"
    incr i
}

puts {--- [4] clock alive (mtime should increment) ---}
set mt1 [sba_read 0xF200BFF8]
set mt2 [sba_read 0xF200BFF8]
puts "MTIME = $mt1 -> $mt2"

puts "=== done ==="
shutdown

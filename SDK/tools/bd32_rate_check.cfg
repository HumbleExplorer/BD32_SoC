# mcycle/mtime 速率对表 — 纯 raw DMI（41位），不依赖 examine
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

init
set total 41

proc dmi_raw {op addr data} {
    global total
    irscan bd32.tap 0x11
    set w [expr {($addr << 34) | ($op << 32) | ($data & 0xFFFFFFFF)}]
    return [drscan bd32.tap $total $w]
}
proc dmiw {addr val} {
    dmi_raw 1 $addr $val
    set r [dmi_raw 0 0 0]
    return [expr {($r >> 32) & 0x3}]
}
proc dmir {addr} {
    dmi_raw 1 $addr 0
    set r [dmi_raw 0 0 0]
    return [expr {$r & 0xFFFFFFFF}]
}
proc halt_cpu {} {
    dmiw 0x10 0x80000001
    for {set i 0} {$i < 50} {incr i} {
        set st [dmir 0x11]
        if {(($st >> 9) & 1) == 1} { return 1 }
        after 20
    }
    return 0
}
proc resume_cpu {} { dmiw 0x10 0x00000001 }
proc rd_csr {csr} {
    dmiw 0x04 0
    dmiw 0x17 [expr {0x00220000 | (0xC000 | $csr)}]
    return [dmir 0x04]
}

if {[halt_cpu] == 0} { puts "HALT_FAILED"; shutdown; exit }
puts "HALTED"
set mc1 [rd_csr 0xB00]
set mt1 [rd_csr 0xC01]
puts "T0_MCYCLE: $mc1  T0_TIME: $mt1"
resume_cpu
after 2000
if {[halt_cpu] == 0} { puts "HALT2_FAILED"; shutdown; exit }
set mc2 [rd_csr 0xB00]
set mt2 [rd_csr 0xC01]
puts "T2_MCYCLE: $mc2  T2_TIME: $mt2"
set dm [expr {$mc2 - $mc1}]
set dt [expr {$mt2 - $mt1}]
puts "DELTA_MCYCLE: $dm   DELTA_TIME: $dt"
puts "RATIO: [expr {double($dm)/double($dt)}]"
resume_cpu
shutdown

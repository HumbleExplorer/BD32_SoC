# 清除 haltreq 残留 + ndmreset 复位进 BootROM 下载等待
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 500
transport select jtag
jtag newtap bd32 tap -irlen 5 -expected-id 0x1bd32003
reset_config none
telnet port disabled
gdb port disabled
tcl port disabled

init
set total 41
proc dmi_raw {op addr data} {
    global total
    irscan bd32.tap 0x11
    set w [expr {($addr << 34) | ($op << 32) | ($data & 0xFFFFFFFF)}]
    return [drscan bd32.tap $total $w]
}
proc dmiw {addr val} {
    dmi_raw 1 $addr $val
    set r [dmi_raw 0 0 0]
    return [expr {($r >> 32) & 0x3}]
}
# haltreq=0, ndmreset=1, dmactive=1 → 150ms → 释放 ndmreset，haltreq 保持 0
dmiw 0x10 0x40000003
sleep 150
dmiw 0x10 0x40000001
sleep 100
dmiw 0x10 0x00000001
puts "CLEAN_RESET_DONE"
shutdown
